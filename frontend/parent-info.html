<script>
      // Add subtle parallax effect to glass panels
      document.addEventListener('mousemove', (e) => {
        const glassPanels = document.querySelectorAll('.glass-panel');
        const x = (e.clientX - window.innerWidth / 2) / 100;
        const y = (e.clientY - window.innerHeight / 2) / 100;

        glassPanels.forEach(panel => {
          panel.style.transform = `translate(${x}px, ${y}px)`;
        });
      });

      // Pre-populate if data exists in sessionStorage
      window.addEventListener('DOMContentLoaded', () => {
        const saved = sessionStorage.getItem('parentInfo');
        if (saved) {
          const info = JSON.parse(saved);
          document.getElementById('parent_name').value = info.parent_name || '';
          document.getElementById('relationship').value = info.relationship || '';
          document.getElementById('mobile').value = info.mobile || '';
          document.getElementById('alt_mobile').value = info.alt_mobile || '';
          document.getElementById('email').value = info.email || '';
          document.getElementById('address').value = info.address || '';
          document.getElementById('city').value = info.city || '';
          document.getElementById('state').value = info.state || '';
          document.getElementById('pincode').value = info.pincode || '';
          document.getElementById('password').value = info.password || '';
          document.getElementById('confirm_password').value = info.password || '';
        }
      });

      // Form submission feedback and saving
      document.querySelector('form').addEventListener('submit', (e) => {
        e.preventDefault();
        
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        
        if (password !== confirmPassword) {
          alert('Passwords do not match.');
          return;
        }

        const btn = e.target.querySelector('button[type="submit"]');
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Processing...';
        btn.disabled = true;

        const parentInfo = {
          parent_name: document.getElementById('parent_name').value,
          relationship: document.getElementById('relationship').value,
          mobile: document.getElementById('mobile').value,
          alt_mobile: document.getElementById('alt_mobile').value,
          email: document.getElementById('email').value,
          address: document.getElementById('address').value,
          city: document.getElementById('city').value,
          state: document.getElementById('state').value,
          pincode: document.getElementById('pincode').value,
          password: password // Save password for submission
        };
        sessionStorage.setItem('parentInfo', JSON.stringify(parentInfo));
        
        setTimeout(() => {
          window.location.href = "course-selection.html";
        }, 1000);
      });
    </script>
