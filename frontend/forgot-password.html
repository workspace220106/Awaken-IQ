<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Forgot Password - Awaken IQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400;1,700&family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/forgot-password.css">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(30, 77, 59, 0.08);
        }
        .soft-glow-primary:hover {
            box-shadow: 0 0 20px rgba(30, 77, 59, 0.3);
        }
        .soft-glow-secondary:hover {
            box-shadow: 0 0 20px rgba(30, 77, 59, 0.2);
        }
        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(30, 77, 59, 0.15);
        }
        .gradient-text {
            background: linear-gradient(to right, #1E4D3B, #386754);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .noise-bg {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Ccircle cx='100' cy='100' r='100' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.02;
        }
        .ornament {
            position: absolute;
            pointer-events: none;
        }
        .ornament-1 {
            top: -5%;
            right: -5%;
            width: 15%;
            height: 15%;
            background: radial-gradient(circle, rgba(30, 77, 59, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            transform: rotate(10deg);
        }
        .ornament-2 {
            bottom: -5%;
            left: -5%;
            width: 12%;
            height: 12%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            transform: rotate(-15deg);
        }
        .stroke-text {
            -webkit-text-stroke: 1px #1E4D3B;
            text-fill-color: transparent;
        }
        html, body {
            overflow-x: hidden;
            width: 100%;
        }
        body {
            background: linear-gradient(to bottom, #ffffff 0%, #ffffff 15%, #e2f3ec 50%, #9ec9b5 100%) !important;
            background-attachment: fixed !important;
        }
    </style>
</head>
<body class="bg-surface font-body-md text-on-background selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col relative ">
    <!-- Decorative Background Elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="ornament ornament-1"></div>
        <div class="ornament ornament-2"></div>
    </div>
    <div class="absolute inset-0 noise-bg pointer-events-none"></div>

    <header class="absolute top-0 w-full z-50 bg-transparent">
        <nav class="flex justify-between items-center px-4 md:px-8 py-2 max-w-container-max mx-auto">
            <div class="flex items-center gap-3">
                <img src="assets/logo.png" alt="Awaken IQ Logo" class="h-[90px] w-auto shrink-0 ml-[3px]">
            </div>

            <a href="login.html" class="bg-primary text-on-primary px-6 py-2.5 rounded-full font-label-lg text-label-lg hover:bg-primary/95 hover:shadow-lg active:scale-95 transition-all">Join Now</a>
        </nav>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-grow flex items-center justify-center pt-32 pb-12 relative bg-transparent">
        <!-- Atmospheric Background Elements -->
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container opacity-40 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-fixed-dim opacity-30 blur-[120px] rounded-full"></div>
        <div class="container max-w-[1280px] px-4 md:px-8 z-10 flex flex-col items-center">
            <!-- Login Card -->
            <div class="w-full max-w-[480px] glass-card rounded-[24px] p-8 md:p-12 transition-transform duration-500 hover:scale-[1.01] hover-lift">
                <!-- Login Header -->
                <div class="text-center mb-10">
                    <h1 class="text-headline-lg text-primary mb-2">Forgot Password</h1>
                    <p class="font-body-md text-on-surface-variant">Enter the parent email you registered with and we'll send a reset link.</p>
                </div>
                <form id="forgot-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="block font-label-lg text-label-lg text-on-surface-variant" for="email">Email Address</label>
                        <input class="w-full px-4 py-3 rounded-[12px] border-outline-variant bg-white/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-on-surface" id="email" placeholder="parent@example.com" type="email" required autocomplete="email">
                    </div>
                    <p id="form-message" class="hidden text-sm font-semibold rounded-xl px-4 py-3"></p>
                    <div class="pt-2 space-y-4">
                        <button id="submit-btn" class="w-full bg-primary text-on-primary py-4 rounded-full font-headline-md text-headline-md soft-glow-primary active:scale-95 transition-all shadow-lg" type="submit">
                            Send Reset Link
                        </button>
                    </div>
                </form>
                <div class="mt-10 text-center">
                    <p class="font-body-md text-on-surface-variant">
                        Remembered it?
                        <a class="text-primary font-bold hover:underline ml-1" href="login.html">Back to login</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    
    <footer class="bg-[#1E4D3B] text-white py-12 w-full relative z-10 font-body-md">
        <div class="max-w-container-max mx-auto px-4 flex flex-col items-center text-center space-y-6">
            <!-- Logo -->
            <img src="assets/logo.png" alt="Awaken IQ Logo" class="h-[65px] w-auto shrink-0 brightness-0 invert opacity-90">
            
            <!-- Links -->
            <div class="flex flex-wrap justify-center gap-x-8 gap-y-2 text-sm font-medium tracking-wide">
                <a href="index.html" class="hover:text-[#D4AF37] transition-colors">About Us</a>
                <a href="course-selection.html" class="hover:text-[#D4AF37] transition-colors">Blog</a>
                <a href="student-info.html" class="hover:text-[#D4AF37] transition-colors">Contact Us</a>
                <a href="course-selection.html" class="hover:text-[#D4AF37] transition-colors">Service</a>
            </div>
            
            <!-- Social Icons -->
            <div class="flex items-center gap-6 text-[#D4AF37] text-lg">
                <a href="#" class="hover:opacity-80 transition-opacity">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c4.56-.93 8-4.96 8-9.75z"/></svg>
                </a>
                <a href="#" class="hover:opacity-80 transition-opacity">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051C.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                </a>
                <a href="#" class="hover:opacity-80 transition-opacity">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M23.498 6.163a3.003 3.003 0 00-2.11-2.108C19.518 3.5 12 3.5 12 3.5s-7.517 0-9.388.555a3.002 3.002 0 00-2.11 2.108C0 8.033 0 12 0 12s0 3.967.502 5.837a3.003 3.003 0 002.11 2.108C4.483 20.5 12 20.5 12 20.5s7.518 0 9.388-.555a3.003 3.003 0 002.11-2.108C24 15.967 24 12 24 12s0-3.967-.502-5.837zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                </a>
            </div>
            
            <!-- Copyright -->
            <p class="text-xs text-white/50 pt-4 border-t border-white/10 w-full max-w-md">
                &copy;2025 Awaken IQ. All Right Reserved | Powered by MBG Card Pvt. Ltd.
            </p>
        </div>
    </footer>

    <script>
        const form = document.getElementById('forgot-form');
        const msg = document.getElementById('form-message');
        const btn = document.getElementById('submit-btn');
        const show = (text, ok) => {
            msg.textContent = text;
            msg.className = 'text-sm font-semibold rounded-xl px-4 py-3 ' + (ok ? 'bg-primary/10 text-primary' : 'bg-rose-50 text-rose-700');
        };
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btn.disabled = true;
            const original = btn.textContent;
            btn.textContent = 'Sending...';
            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value.trim() })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || 'Could not send the reset email. Please try again.');
                show(data.message + ' Check your inbox (and spam folder).', true);
                form.querySelector('#email').value = '';
            } catch (err) {
                show(err.message, false);
            } finally {
                btn.disabled = false;
                btn.textContent = original;
            }
        });
    </script>
</body>
</html>
