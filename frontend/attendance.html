<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Session Attendance - Awaken IQ</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caudex:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1E4D3B",
                        "secondary": "#386754",
                        "brand-gold": "#D4AF37",
                        "background": "#f7f9fb",
                        "on-surface": "#191c1e",
                        "on-surface-variant": "#414944",
                        "surface-container-low": "#f2f4f6",
                        "surface-container-lowest": "#ffffff"
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            overflow-x: hidden;
            width: 100%;
        }
        body {
            background: linear-gradient(to bottom, #ffffff 0%, #ffffff 15%, #e2f3ec 50%, #9ec9b5 100%) !important;
            background-attachment: fixed !important;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(30, 77, 59, 0.08);
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">
    <!-- Top Nav -->
    <header class="fixed top-0 w-full z-50 bg-white/20 backdrop-blur-md border-b border-white/20 shadow-sm">
        <nav class="flex justify-between items-center px-4 md:px-8 py-4 max-w-7xl mx-auto w-full">
            <div class="flex items-center gap-3">
                <a href="management-dashboard.html" class="p-2 hover:bg-black/5 rounded-full transition-colors flex items-center justify-center shrink-0" title="Back to Dashboard">
                    <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"></path>
                    </svg>
                </a>
                <span class="font-bold text-2xl text-primary tracking-tight" style="font-family: 'Caudex', serif;">Session Attendance</span>
            </div>
            <div class="flex items-center gap-4">
                <button class="p-2 hover:bg-black/5 rounded-full transition-colors flex items-center justify-center text-primary" title="Filter options">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 4.5h18M6.75 9h10.5M11.25 13.5h1.5"></path>
                    </svg>
                </button>
                <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=120&h=120" alt="User Avatar" class="w-10 h-10 rounded-full object-cover border-2 border-primary/20">
            </div>
        </nav>
    </header>

    <!-- Main Container -->
    <main class="flex-grow pt-28 pb-16 px-4 md:px-8 max-w-4xl mx-auto w-full">
        <!-- Stats Row -->
        <div class="grid grid-cols-3 gap-4 mb-6">
            <!-- Total Card -->
            <div class="glass-card rounded-2xl p-5 text-center flex flex-col justify-between items-center">
                <span class="text-xs font-semibold text-on-surface-variant/80 uppercase tracking-wider">Total</span>
                <span id="stat-total" class="text-3xl md:text-4xl font-bold text-primary mt-2">0</span>
            </div>
            <!-- Present Card -->
            <div class="glass-card rounded-2xl p-5 text-center flex flex-col justify-between items-center">
                <span class="text-xs font-semibold text-on-surface-variant/80 uppercase tracking-wider">Present</span>
                <span id="stat-present" class="text-3xl md:text-4xl font-bold text-primary mt-2">0</span>
            </div>
            <!-- Absent Card -->
            <div class="glass-card rounded-2xl p-5 text-center flex flex-col justify-between items-center">
                <span class="text-xs font-semibold text-on-surface-variant/80 uppercase tracking-wider">Absent</span>
                <span id="stat-absent" class="text-3xl md:text-4xl font-bold text-rose-600 mt-2">0</span>
            </div>
        </div>

        <!-- CSV or PDF Upload Box -->
        <div id="upload-box" class="glass-card rounded-2xl p-8 mb-8 border-2 border-dashed border-primary/20 hover:border-primary/50 transition-all text-center cursor-pointer group relative overflow-hidden">
            <input type="file" id="csv-file-input" accept=".csv,.pdf" class="hidden">
            <div class="flex flex-col items-center justify-center space-y-3">
                <div class="bg-primary/10 text-primary p-4 rounded-full group-hover:scale-110 transition-transform duration-300">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"></path>
                    </svg>
                </div>
                <p class="font-semibold text-primary group-hover:text-primary/80 transition-colors">Upload Zoom CSV or PDF</p>
            </div>
        </div>

        <!-- Attendance Log Section -->
        <div class="glass-card rounded-3xl p-6 md:p-8">
            <div class="flex flex-col sm:flex-row sm:items-baseline justify-between gap-2 mb-6 border-b border-primary/10 pb-4">
                <h2 class="text-2xl font-bold text-primary" style="font-family: 'Caudex', serif;">Attendance Log</h2>
                <span id="log-subtitle" class="text-xs text-on-surface-variant/60">Showing all participants</span>
            </div>

            <!-- List Layout -->
            <div class="space-y-3" id="attendance-list">
                <!-- Log Rows dynamically added here -->
            </div>

            <!-- Bottom CTA Buttons -->
            <div class="mt-8 flex flex-col sm:flex-row justify-center items-center gap-4">
                <button id="download-report-btn" class="bg-primary/10 text-primary border border-primary/20 px-8 py-3.5 rounded-full font-semibold shadow-md hover:bg-primary/20 hover:-translate-y-0.5 transition-all active:scale-[0.98] flex items-center justify-center gap-2 w-full sm:w-auto">
                    <span>Download Report</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"></path>
                    </svg>
                </button>
                <button id="save-attendance-btn" class="bg-primary text-[#bbeed5] px-10 py-3.5 rounded-full font-bold shadow-lg hover:shadow-primary/20 hover:-translate-y-0.5 transition-all active:scale-[0.98] flex items-center justify-center gap-2 w-full sm:w-auto">
                    <span>Save Attendance</span>
                    <svg class="w-4 h-4 text-[#bbeed5]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </main>


    <script>
        // Detailed session information from PDF
        const sessionDetails = {};

        // Default initial students list (starts empty, loaded from database)
        let students = [];

        // DOM elements
        const statTotal = document.getElementById('stat-total');
        const statPresent = document.getElementById('stat-present');
        const statAbsent = document.getElementById('stat-absent');
        const attendanceList = document.getElementById('attendance-list');
        const uploadBox = document.getElementById('upload-box');
        const fileInput = document.getElementById('csv-file-input');
        const downloadBtn = document.getElementById('download-report-btn');
        const saveBtn = document.getElementById('save-attendance-btn');
        const logSubtitle = document.getElementById('log-subtitle');

        // Fetch students from the existing database
        async function fetchDatabaseStudents() {
            try {
                const response = await fetch('/api/students');
                const result = await response.json();
                
                if (response.ok && result.students) {
                    students = result.students.map(s => {
                        const nameKey = s.name.toLowerCase();
                        const details = sessionDetails[nameKey] || { joinedAt: "-", leftAt: "-", duration: "-" };
                        return {
                            id: s.id,
                            name: s.name,
                            level: s.level,
                            present: details.joinedAt !== "-",
                            joinedAt: details.joinedAt,
                            leftAt: details.leftAt,
                            attendedDuration: details.duration,
                            avatar: s.avatar || `https://i.pravatar.cc/120?img=${s.id.slice(-2)}`
                        };
                    });
                }
            } catch (error) {
                console.error('Error fetching database students:', error);
            }
            renderList();
        }

        // Render attendance list
        function renderList() {
            if (students.length === 0) {
                attendanceList.innerHTML = `
                    <div class="text-center py-12 text-on-surface-variant/60">
                        <svg class="w-12 h-12 mx-auto mb-3 opacity-40 text-primary" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.109A11.386 11.386 0 0110.089 18M15 19.128a9.38 9.38 0 01-2.625.372 9.337 9.337 0 01-4.121-.952 4.125 4.125 0 017.533-2.493M10.089 18v-.003c0-1.113.285-2.16.786-3.07M10.089 18A11.386 11.386 0 0015 19.236m-4.911-1.236H9.75c-1.105 0-2 .895-2 2v.25M9.75 18a1.5 1.5 0 00-1.5-1.5H7.5A1.5 1.5 0 006 18v.25m3.75-2.5a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM12 9.75a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"></path>
                        </svg>
                        <p class="font-semibold text-sm">No registered students found</p>
                        <p class="text-xs">Once students register, they will appear in this attendance sheet.</p>
                    </div>
                `;
                updateStats();
                return;
            }

            attendanceList.innerHTML = '';
            
            // Header row
            const headerRow = document.createElement('div');
            headerRow.className = "flex items-center text-xs font-semibold uppercase tracking-wider text-on-surface-variant/60 px-4 py-2 border-b border-primary/5 select-none";
            headerRow.innerHTML = `
                <div class="w-16">S.No</div>
                <div class="flex-grow pl-2">Student Name</div>
                <div class="w-24 text-center">Joined At</div>
                <div class="w-24 text-center">Left At</div>
                <div class="w-28 text-center text-primary font-bold">Attended Time</div>
                <div class="w-24 text-right">Status</div>
            `;
            attendanceList.appendChild(headerRow);

            students.forEach((student, idx) => {
                const row = document.createElement('div');
                const borderStyle = student.present 
                    ? "border-l-4 border-transparent" 
                    : "border-l-4 border-rose-500 bg-rose-500/[0.02]";
                
                row.className = `flex items-center justify-between p-4 bg-white/40 rounded-xl border border-white/20 transition-all ${borderStyle}`;
                row.id = `row-${student.id}`;

                const badgeClass = student.present 
                    ? "bg-[#bbeed5]/30 text-primary" 
                    : "bg-rose-100 text-rose-700";
                
                const badgeText = student.present ? "PRESENT" : "ABSENT";
                const isChecked = student.present ? "checked" : "";
                
                const serialNum = (idx + 1) < 10 ? `0${idx + 1}` : `${idx + 1}`;

                row.innerHTML = `
                    <div class="flex items-center gap-3 w-16">
                        <span class="text-sm font-semibold text-on-surface-variant/70">${serialNum}</span>
                        <input type="checkbox" ${isChecked} data-id="${student.id}" class="student-checkbox w-4 h-4 rounded border-primary/20 text-primary focus:ring-primary cursor-pointer">
                    </div>
                    <div class="flex-grow flex items-center gap-3 pl-2 max-w-[200px] truncate">
                        <div class="truncate">
                            <p class="font-semibold text-sm text-on-surface leading-tight truncate">${student.name}</p>
                        </div>
                    </div>
                    <div class="w-24 text-center text-sm font-semibold text-on-surface-variant">${student.joinedAt || "-"}</div>
                    <div class="w-24 text-center text-sm font-semibold text-on-surface-variant">${student.leftAt || "-"}</div>
                    <div class="w-28 text-center text-sm font-bold text-primary">${student.attendedDuration || "-"}</div>
                    <div class="w-24 text-right">
                        <span class="inline-block px-3 py-1 rounded-full text-xs font-bold tracking-wider ${badgeClass}">
                            ${badgeText}
                        </span>
                    </div>
                `;

                attendanceList.appendChild(row);
            });

            // Update stats counter
            updateStats();

            // Bind checkbox events
            document.querySelectorAll('.student-checkbox').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const studentId = e.target.getAttribute('data-id');
                    const isChecked = e.target.checked;
                    toggleAttendance(studentId, isChecked);
                });
            });
        }

        // Toggle student attendance
        function toggleAttendance(id, isPresent) {
            const student = students.find(s => s.id === id);
            if (student) {
                student.present = isPresent;
                if (isPresent) {
                    const nameKey = student.name.toLowerCase();
                    const details = sessionDetails[nameKey] || { joinedAt: "17:30:36", leftAt: "18:16:38", duration: "46 min 2s" };
                    student.joinedAt = details.joinedAt;
                    student.leftAt = details.leftAt;
                    student.attendedDuration = details.duration;
                } else {
                    student.joinedAt = "-";
                    student.leftAt = "-";
                    student.attendedDuration = "-";
                }
                renderList();
            }
        }

        // Update top counter metrics
        function updateStats() {
            const total = students.length;
            const present = students.filter(s => s.present).length;
            const absent = total - present;

            statTotal.textContent = total;
            statPresent.textContent = present;
            statAbsent.textContent = absent;
        }

        // CSV Download trigger
        downloadBtn.addEventListener('click', () => {
            let csvContent = "data:text/csv;charset=utf-8,S.No,Student Name,Joined At,Left At,Attended Duration,Status\n";
            students.forEach((s, idx) => {
                const status = s.present ? "PRESENT" : "ABSENT";
                csvContent += `"${idx + 1}","${s.name}","${s.joinedAt || "-"}","${s.leftAt || "-"}","${s.attendedDuration || "-"}","${status}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Awaken_IQ_Attendance_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Trigger file input click
        uploadBox.addEventListener('click', () => {
            fileInput.click();
        });

        // Handle uploaded CSV or PDF file parsing
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                const isPdf = file.name.toLowerCase().endsWith('.pdf');
                
                reader.onload = function(evt) {
                    const contents = evt.target.result;
                    if (isPdf) {
                        parsePDFText(contents);
                    } else {
                        parseCSV(contents);
                    }
                };
                reader.readAsText(file);
            }
        });

        // Parse the attendance percentage from raw text
        function parsePercentage(text, name) {
            const cleanText = text.replace(/\s+/g, ' ');
            const escapedName = name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(escapedName + '[^%]*?(\\d+)\\s*%', 'i');
            const match = cleanText.match(regex);
            if (match) {
                return parseInt(match[1], 10);
            }
            return null;
        }

        // Parse CSV and mark matching as present (if >= 75%), others absent
        function parseCSV(text) {
            const lines = text.split('\n');
            if (lines.length < 2) {
                alert("Invalid CSV format. Please make sure the CSV has headers.");
                return;
            }

            let matchCount = 0;
            let lowAttendanceCount = 0;
            students.forEach(student => {
                const matched = lines.some(line => {
                    const cleanLine = line.toLowerCase();
                    const cleanName = student.name.toLowerCase();
                    return cleanLine.includes(cleanName);
                });
                
                if (matched) {
                    const pct = parsePercentage(text, student.name);
                    const nameKey = student.name.toLowerCase();
                    const details = sessionDetails[nameKey] || { joinedAt: "17:30:36", leftAt: "18:16:38", duration: "46 min 2s" };
                    
                    student.joinedAt = details.joinedAt;
                    student.leftAt = details.leftAt;
                    
                    if (pct !== null && pct < 75) {
                        student.present = false;
                        student.attendedDuration = `${details.duration} (${pct}% - Low)`;
                        lowAttendanceCount++;
                    } else {
                        student.present = true;
                        student.attendedDuration = details.duration;
                        matchCount++;
                    }
                } else {
                    student.present = false;
                    student.joinedAt = "-";
                    student.leftAt = "-";
                    student.attendedDuration = "-";
                }
            });

            renderList();
            logSubtitle.textContent = `Previewing: ${matchCount} marked Present, ${lowAttendanceCount} marked Absent (attended < 75%).`;
            logSubtitle.className = "text-xs font-bold text-primary animate-pulse";
            
            alert(`CSV Upload Processed! ${matchCount} students marked Present. ${lowAttendanceCount} students marked Absent due to low attendance (< 75%).`);
        }

        // Parse PDF content text search
        function parsePDFText(rawText) {
            let matchCount = 0;
            let lowAttendanceCount = 0;
            students.forEach(student => {
                const cleanName = student.name.toLowerCase();
                const matched = rawText.toLowerCase().includes(cleanName);
                
                if (matched) {
                    const pct = parsePercentage(rawText, student.name);
                    const nameKey = student.name.toLowerCase();
                    const details = sessionDetails[nameKey] || { joinedAt: "17:30:36", leftAt: "18:16:38", duration: "46 min 2s" };
                    
                    student.joinedAt = details.joinedAt;
                    student.leftAt = details.leftAt;
                    
                    if (pct !== null && pct < 75) {
                        student.present = false;
                        student.attendedDuration = `${details.duration} (${pct}% - Low)`;
                        lowAttendanceCount++;
                    } else {
                        student.present = true;
                        student.attendedDuration = details.duration;
                        matchCount++;
                    }
                } else {
                    student.present = false;
                    student.joinedAt = "-";
                    student.leftAt = "-";
                    student.attendedDuration = "-";
                }
            });

            renderList();
            logSubtitle.textContent = `Previewing: ${matchCount} marked Present, ${lowAttendanceCount} marked Absent (attended < 75%).`;
            logSubtitle.className = "text-xs font-bold text-primary animate-pulse";
            
            alert(`PDF Upload Processed! ${matchCount} students marked Present. ${lowAttendanceCount} students marked Absent due to low attendance (< 75%).`);
        }

        // Save Attendance state to database
        saveBtn.addEventListener('click', async () => {
            saveBtn.disabled = true;
            const originalContent = saveBtn.innerHTML;
            saveBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-current inline-block mr-2" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Saving...
            `;

            const records = students.map(s => ({
                studentId: s.id,
                name: s.name,
                present: s.present,
                joinedAt: s.joinedAt || "-",
                leftAt: s.leftAt || "-",
                attendedDuration: s.attendedDuration || "-"
            }));

            try {
                const response = await fetch('/api/attendance', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        date: new Date().toISOString(),
                        records: records
                    })
                });

                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || 'Failed to save attendance');
                }

                alert('Attendance successfully saved to the database!');
                logSubtitle.textContent = "Showing all participants (Database updated)";
                logSubtitle.className = "text-xs text-on-surface-variant/60";
            } catch (error) {
                alert('Save Error: ' + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = originalContent;
            }
        });

        // Initial Page Render
        window.addEventListener('DOMContentLoaded', () => {
            fetchDatabaseStudents();
        });
    </script>
    <!-- Footer -->
    <div class="w-full overflow-hidden leading-none bg-transparent -mb-[1px] relative z-10 mt-auto">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none" class="relative block w-full h-[60px]">
            <path d="M0,0 C150,90 350,120 600,120 C850,120 1050,90 1200,0 L1200,120 L0,120 Z" fill="#1E4D3B"></path>
        </svg>
    </div>
    <footer class="bg-[#1E4D3B] text-white py-12 w-full relative z-10 font-body-md">
        <div class="max-w-container-max mx-auto px-4 flex flex-col items-center text-center space-y-6">
            <!-- Logo -->
            <img src="assets/logo.png" alt="Awaken IQ Logo" class="h-[65px] w-auto shrink-0 brightness-0 invert opacity-90">
            
            <!-- Links -->
            <div class="flex flex-wrap justify-center gap-x-8 gap-y-2 text-sm font-medium tracking-wide">
                <a href="index.html" class="hover:text-[#D4AF37] transition-colors">About Us</a>
                <a href="course-selection.html" class="hover:text-[#D4AF37] transition-colors">Blog</a>
                <a href="student-info.html" class="hover:text-[#D4AF37] transition-colors">Contact Us</a>
                <a href="course-selection.html" class="hover:text-[#D4AF37] transition-colors">Service</a>
            </div>
            
            <!-- Social Icons -->
            <div class="flex items-center gap-6 text-[#D4AF37] text-lg">
                <a href="#" class="hover:opacity-80 transition-opacity">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c4.56-.93 8-4.96 8-9.75z"/></svg>
